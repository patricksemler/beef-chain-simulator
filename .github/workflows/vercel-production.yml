name: Deploy production site

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Configure production assistant Worker
        run: node scripts/configure-assistant-worker.mjs production
        env:
          ASSISTANT_PRODUCTION_D1_ID: ${{ secrets.ASSISTANT_PRODUCTION_D1_ID }}
      - name: Migrate production assistant database
        run: npx wrangler d1 migrations apply ASSISTANT_DB --remote --config .wrangler/assistant.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy production assistant Worker
        run: npx wrangler deploy --config .wrangler/assistant.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure assistant hash salt
        run: printf '%s' "$ASSISTANT_IP_HASH_SALT" | npx wrangler secret put IP_HASH_SALT --config .wrangler/assistant.generated.json
        env:
          ASSISTANT_IP_HASH_SALT: ${{ secrets.ASSISTANT_IP_HASH_SALT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run build
        env:
          VITE_ASSISTANT_API_URL: ${{ secrets.ASSISTANT_PRODUCTION_API_URL }}
      - name: Deploy static client to Vercel
        run: npx vercel@55.0.0 deploy dist/client --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: team_ygMo871nidHmzvlGuykMxeAh
          VERCEL_PROJECT_ID: prj_wjwHY8Y5rqc9uxrHO3fDo6eJF78v
