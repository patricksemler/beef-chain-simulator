name: Deploy production site

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx vercel@55.0.0 link --cwd dist/client --project beef-chain-simulator --yes --token="${{ secrets.VERCEL_TOKEN }}"
      - run: npx vercel@55.0.0 deploy dist/client --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
