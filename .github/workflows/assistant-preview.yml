name: Deploy assistant preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Configure preview assistant Worker
        run: node scripts/configure-assistant-worker.mjs preview
        env:
          ASSISTANT_PREVIEW_D1_ID: ${{ secrets.ASSISTANT_PREVIEW_D1_ID }}
          ASSISTANT_PREVIEW_ORIGIN: ${{ secrets.ASSISTANT_PREVIEW_ORIGIN }}
      - name: Migrate preview database
        run: npx wrangler d1 migrations apply ASSISTANT_DB --remote --env preview --config .wrangler/assistant.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy preview assistant Worker
        run: npx wrangler deploy --env preview --config .wrangler/assistant.generated.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure preview hash salt
        run: printf '%s' "$ASSISTANT_IP_HASH_SALT" | npx wrangler secret put IP_HASH_SALT --env preview --config .wrangler/assistant.generated.json
        env:
          ASSISTANT_IP_HASH_SALT: ${{ secrets.ASSISTANT_IP_HASH_SALT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build static preview
        run: npm run build
        env:
          VITE_ASSISTANT_API_URL: ${{ secrets.ASSISTANT_PREVIEW_API_URL }}
      - name: Deploy Vercel preview
        run: npx vercel@55.0.0 deploy dist/client --yes --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: team_ygMo871nidHmzvlGuykMxeAh
          VERCEL_PROJECT_ID: prj_wjwHY8Y5rqc9uxrHO3fDo6eJF78v
